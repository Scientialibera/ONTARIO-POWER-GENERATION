[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontario-power-generation"
version = "0.1.0"
description = "Ontario electricity market intelligence, forecasting and battery optimization"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "numpy>=1.26",
  "scipy>=1.13",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "joblib>=1.4"
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["app*", "services*", "domain*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
